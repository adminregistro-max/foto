    var dallaGalleria = function (e) { return /\.googleusercontent\.com$/.test(e.origin); };
    var manda = function (tipo) { try { sorgente && sorgente.postMessage({ tipo: tipo }, '*'); } catch (_) {} };

    function togli() { if (attesa.parentNode) attesa.parentNode.removeChild(attesa); stato = 'fatto'; }
    function dissolvi() {
      if (stato === 'fatto' || stato === 'uscita') return;
      stato = 'uscita'; manda('fil-via'); manda('fil-arrivata');
      if (!attesa.animate) return togli();
      attesa.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 350, easing: 'ease', fill: 'forwards' }).onfinish = togli;
    }
    function vola(r) {
      if (stato !== 'attesa') return;
      if (!r || !r.w || calmo || !lira.animate) return dissolvi();
      stato = 'volo';
      var p = lira.getBoundingClientRect(), op = getComputedStyle(lira).opacity;
      lira.style.animation = 'none';
      manda('fil-via');
      var dur = 750;
      lira.animate([
        { transform: 'translate(0,0) scale(1)', opacity: op },
        { opacity: 1, offset: .3 },
        { transform: 'translate(' + (r.x - p.left) + 'px,' + (r.y - p.top) + 'px) scale(' + (r.w / p.width) + ')', opacity: 1 }
      ], { duration: dur, easing: 'cubic-bezier(.65,0,.35,1)', fill: 'forwards' }).onfinish = function () {
        stato = 'arrivata'; manda('fil-arrivata');
        setTimeout(togli, 200); // se la galleria non risponde
      };
      fondo.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 550, delay: 150, easing: 'ease-out', fill: 'forwards' });
    }

    addEventListener('message', function (e) {
      var m = e.data || {};
      if (!dallaGalleria(e) || typeof m.tipo !== 'string') return;
      if (m.tipo === 'fil-ciao' && stato === 'attesa') { sorgente = e.source; manda('fil-splash'); }
      else if (m.tipo === 'fil-pronta') vola(m.rect);
      else if (m.tipo === 'fil-ok' && stato === 'arrivata') togli();
    });
    // Vecchia versione della galleria o problemi: dopo il caricamento non si resta bloccati
    ifr.addEventListener('load', function () { setTimeout(function () { if (stato === 'attesa') dissolvi(); }, sorgente ? 2500 : 1500); });
    setTimeout(function () { if (stato === 'attesa') dissolvi(); }, 15000);
  })();

  // iPhone/Safari: con lo swipe indietro la pagina viene ripresa dalla cache (bfcache)
  // e l'iframe della galleria resta "congelato", senza più scorrere. In quel caso la ricarichiamo.
  window.addEventListener('pageshow', function (e) {
    if (e.persisted) location.reload();
  });
</script>
